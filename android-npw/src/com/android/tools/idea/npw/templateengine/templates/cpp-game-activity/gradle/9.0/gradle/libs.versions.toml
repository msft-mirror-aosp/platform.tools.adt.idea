[versions]
androidGradlePlugin = "9.0.1"
androidxCore = "1.18.0"
androidxAppcompat = "1.7.1"
material = "1.13.0"
androidxGamesActivity = "4.0.0"
androidxTestExt = "1.3.0"
androidxTestEspresso = "3.7.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxTestEspresso" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-games-activity = { group = "androidx.games", name = "games-activity", version.ref = "androidxGamesActivity" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
