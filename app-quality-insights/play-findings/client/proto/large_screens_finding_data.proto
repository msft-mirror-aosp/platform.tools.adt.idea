syntax = "proto3";

package google.play.androidpublisher.v3;

option java_package = "com.google.play.androidpublisher.v3";
option java_multiple_files = true;
option java_outer_classname = "LargeScreensFindingDataProto";

// TODO(b/517599039): Re-sync once the v3 ComputeFindings schema is finalized.

// The device a Large Screens defect was observed on.
//
// Large Screens defects are device scoped: the defect, the repro steps and
// often the fix depend on the form factor, the OEM's framework customizations
// and the Android version, so each event of a finding carries the device it was
// observed on.
message LargeScreensDeviceInfo {
  // Brand of the device, i.e. "ro.product.brand" (e.g. "samsung", "google").
  string device_brand = 1;

  // Model of the device, i.e. "ro.product.model" (e.g. "sm-i610").
  string device_model = 2;

  // Android platform version the device was running (e.g. "14", "17").
  string android_version = 3;

  // Android SDK (API) level the device was running (e.g. 34).
  // Unset when unknown.
  optional int32 android_sdk_version = 4;
}

// A single capture of the screen: the screenshot and the UI hierarchy that was
// on screen when it was taken.
message LargeScreensScreenCapture {
  // Signed image URL of the screenshot.
  //
  // The link is valid for 24 hours from when the findings were computed, so
  // clients must not cache or store it.
  string screenshot_url = 1;

  // Download URL of the UI hierarchy dump captured with the screenshot: the
  // tree of on-screen UI elements and their bounds.
  //
  // Empty when no dump was captured. The link is valid for 24 hours from when
  // the findings were computed, so clients must not cache or store it.
  string ui_hierarchy_download_url = 2;
}

// One occurrence of a Large Screens visual or layout defect: one time it was
// observed, on a specific device and screen.
message LargeScreensVisualEvent {
  // The device the defect was observed on.
  LargeScreensDeviceInfo device_info = 1;

  // The captures of the screen showing the defect, e.g. the screen before and
  // after scrolling, or the defect in several places of the same screen.
  // Contains at least one and at most 10 captures.
  repeated LargeScreensScreenCapture captures = 2;
}

// Finding data for Large Screens layout findings (LARGE_SCREENS_LAYOUT).
message LargeScreensLayoutFindingData {
  // Types of UI layout issues identified on large screens.
  // This enum is not frozen. New values may be added in the future,
  // and clients should handle unknown values gracefully.
  enum LayoutIssueType {
    // Unspecified layout issue type.
    LAYOUT_ISSUE_TYPE_UNSPECIFIED = 0;

    // Unnecessary or excessive empty space in the screen layout.
    EXCESSIVE_WHITE_SPACE = 1;

    // App content does not fill the available screen area (e.g. unwanted
    // letterboxing).
    DOES_NOT_USE_ENTIRE_SCREEN = 2;

    // UI components overlap each other, obscuring content or controls.
    OVERLAPPING = 3;

    // Images or typography rendered inappropriately large or scaled up.
    IMAGES_OR_TEXT_ARE_TOO_LARGE_OR_BLOWN_UP = 4;

    // Image/text assets appear pixelated, blurry, or distorted due to scaling.
    PIXELS_LOOK_BLURRED_OR_STRETCHED = 5;

    // Content extends beyond visible screen boundaries and is truncated.
    CONTENT_CUT_OFF_ON_SCREEN = 6;

    // Buttons or interactive controls lack consistent sizing, alignment, or
    // spacing.
    BUTTONS_OR_CONTROLS_PLACEMENTS_ARE_NOT_UNIFORM = 7;

    // Images or typography aspect ratio is distorted or stretched.
    IMAGES_OR_TEXT_ARE_STRETCHED = 8;

    // Sub-navigation bars, tab bars, or menus appear compressed or cramped.
    SUBNAVS_LOOK_CRUNCHED_OR_SQUISHED = 9;

    // Individual interactive controls or buttons are excessively sized.
    BUTTONS_OR_CONTROLS_ARE_TOO_BIG = 10;

    // Content or controls overlap system bars, display cutouts, or navigation
    // bars.
    EDGE_TO_EDGE = 11;
  }

  // The specific type of layout issue detected.
  LayoutIssueType layout_issue_type = 1;

  // Occurrences of this layout issue across tested devices and screens. Capped
  // to 10 events.
  repeated LargeScreensVisualEvent events = 2;
}

// Finding data for Large Screens visual findings
// (LARGE_SCREENS_CAMERA_STRETCHED and LARGE_SCREENS_CAMERA_SIDEWAYS).
message LargeScreensVisualFindingData {
  // Occurrences of this visual issue across tested devices and screens. Capped
  // to 10 events.
  repeated LargeScreensVisualEvent events = 1;
}

// Visual evidence made of one or more app states in chronological order.
//
// Each state is optionally reached by a configuration change and is shown by
// one screen capture.
message LargeScreensVisualEvidence {
  // The app states, in chronological order. Contains at least one and at most
  // 10 steps.
  repeated LargeScreensEvidenceStep steps = 1;
}

// One state of the app and the screen capture that shows it.
message LargeScreensEvidenceStep {
  // A configuration change performed on the device or the app window. See
  // https://developer.android.com/docs/quality-guidelines/adaptive-app-quality/tier-3.
  // This enum is not frozen. New values may be added in the future,
  // and clients should handle unknown values gracefully.
  enum ConfigurationChange {
    // Unspecified configuration change.
    CONFIGURATION_CHANGE_UNSPECIFIED = 0;

    // No configuration change; captures the initial app state.
    NONE = 1;

    // The device was folded.
    FOLD = 2;

    // The device was unfolded.
    UNFOLD = 3;

    // The device was rotated.
    ROTATE = 4;

    // The app window was resized (split screen or desktop windowing).
    RESIZE = 5;
  }

  // The configuration change that led to this state: NONE for the first step,
  // CONFIGURATION_CHANGE_UNSPECIFIED when the test run did not record it.
  ConfigurationChange configuration_change = 1;

  // The capture of the screen in this state: one state is shown by one
  // screenshot, plus the UI hierarchy dump when the test run captured one.
  LargeScreensScreenCapture capture = 2;

  // Whether the defect is visible in this state, so clients can highlight it.
  // Unset when the test run did not record which state shows the defect.
  optional bool shows_issue = 3;
}

// Finding data for Large Screens continuity findings
// (LARGE_SCREENS_CONTINUITY): app state lost across one or more configuration
// changes.
message LargeScreensContinuityFindingData {
  // Occurrences of this continuity issue across tested devices. Capped to 10
  // events.
  repeated LargeScreensContinuityEvent events = 1;
}

// One continuity event: the app states observed on one device.
message LargeScreensContinuityEvent {
  // The device the defect was observed on.
  LargeScreensDeviceInfo device_info = 1;

  // The app states in chronological order: the initial state, then one state
  // per configuration change when the test run records them. Contains at least
  // one and at most 10 steps.
  LargeScreensVisualEvidence evidence = 2;
}

// Finding data for Large Screens crash findings (LARGE_SCREENS_CRASH).
message LargeScreensCrashFindingData {
  // One occurrence of the crash, on a specific device.
  message CrashEvent {
    // The device the crash was observed on.
    LargeScreensDeviceInfo device_info = 1;

    // Stack trace of the crash.
    string stack_trace = 2;
  }

  // Occurrences of this crash across tested devices. Capped to 10 events.
  repeated CrashEvent events = 1;
}
