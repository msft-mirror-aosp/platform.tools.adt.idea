syntax = "proto3";

package google.play.androidpublisher.v3;

import "drm_app_compat_finding_data.proto";
import "edge_to_edge_compat_finding_data.proto";
import "lab_crash_no_telemetry_finding_data.proto";
import "lab_crash_sixteen_kb_finding_data.proto";
import "large_screens_finding_data.proto";
import "vitals_anomaly_finding_data.proto";
import "vitals_bad_behavior_finding_data.proto";
import "vitals_device_bad_behavior_finding_data.proto";

option java_package = "com.google.play.androidpublisher.v3";
option java_multiple_files = true;
option java_outer_classname = "FindingDataProto";

// Data associated with a finding that can be used to understand and process
// the finding programmatically.
//
// This is populated on a `Finding` (see finding.proto) only for specific
// finding types that carry structured diagnostic payload.
message FindingData {

  // The specific type-dependent data payload containing structural details of
  // the finding.
  oneof data_type {
    // Data for DRM App Compatibility findings
    // [Finding.Type.DRM_APP_COMPAT][google.play.androidpublisher.v3.Finding.Type.DRM_APP_COMPAT]).
    //
    DrmAppCompatFindingData drm_app_compat = 1;

    // Data for Edge-to-Edge display compatibility findings
    // [Finding.Type.EDGE_TO_EDGE_COMPAT][google.play.androidpublisher.v3.Finding.Type.EDGE_TO_EDGE_COMPAT].
    EdgeToEdgeCompatFindingData edge_to_edge_compat = 2;

    // Data for Vitals Anomaly findings
    // [Finding.Type.VITALS_ANOMALY][google.play.androidpublisher.v3.Finding.Type.VITALS_ANOMALY].
    VitalsAnomalyFindingData vitals_anomaly = 3;

    // Data for Vitals Bad Behavior findings
    // [Finding.Type.VITALS_BAD_BEHAVIOR][google.play.androidpublisher.v3.Finding.Type.VITALS_BAD_BEHAVIOR].
    VitalsBadBehaviorFindingData vitals_bad_behavior = 4;

    // Data for Vitals Device Bad Behavior findings
    // [Finding.Type.VITALS_DEVICE_BAD_BEHAVIOR][google.play.androidpublisher.v3.Finding.Type.VITALS_DEVICE_BAD_BEHAVIOR].
    VitalsDeviceBadBehaviorFindingData vitals_device_bad_behavior = 5;

    // (-- Field number 6 is reserved for SDK_HAS_CRASH_ANNOTATION finding data.
    // --)

    // Data for Lab Crash (no telemetry) findings
    // [Finding.Type.LAB_CRASH_NO_TELEMETRY][google.play.androidpublisher.v3.Finding.Type.LAB_CRASH_NO_TELEMETRY].
    LabCrashNoTelemetryFindingData lab_crash_no_telemetry = 7;

    // Data for 16 KB page-size Lab Crash findings
    // [Finding.Type.LAB_CRASH_SIXTEEN_KB][google.play.androidpublisher.v3.Finding.Type.LAB_CRASH_SIXTEEN_KB].
    LabCrashSixteenKbFindingData lab_crash_sixteen_kb = 8;

    // Data for Large Screens Layout findings
    // [Finding.Type.LARGE_SCREENS_LAYOUT][google.play.androidpublisher.v3.Finding.Type.LARGE_SCREENS_LAYOUT].
    LargeScreensLayoutFindingData large_screens_layout = 9;

    // Data for Large Screens Visual findings
    // ([Finding.Type.LARGE_SCREENS_CAMERA_STRETCHED][google.play.androidpublisher.v3.Finding.Type.LARGE_SCREENS_CAMERA_STRETCHED]
    // and
    // [Finding.Type.LARGE_SCREENS_CAMERA_SIDEWAYS][google.play.androidpublisher.v3.Finding.Type.LARGE_SCREENS_CAMERA_SIDEWAYS]).
    LargeScreensVisualFindingData large_screens_visual = 10;

    // Data for Large Screens Crash findings
    // [Finding.Type.LARGE_SCREENS_CRASH][google.play.androidpublisher.v3.Finding.Type.LARGE_SCREENS_CRASH].
    LargeScreensCrashFindingData large_screens_crash = 11;

    // Data for Large Screens Continuity findings
    // [Finding.Type.LARGE_SCREENS_CONTINUITY][google.play.androidpublisher.v3.Finding.Type.LARGE_SCREENS_CONTINUITY].
    LargeScreensContinuityFindingData large_screens_continuity = 12;
  }
}
